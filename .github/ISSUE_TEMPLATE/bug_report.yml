name: Bug report
description: Report a reproducible problem in Nexus
labels: []
body:
  - type: input
    id: version
    attributes:
      label: Version or Git commit
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Include the OS, architecture, and installation method.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps, expected result, and actual result
      description: Remove credentials, real host details, and recovery data. Report vulnerabilities privately.
    validations:
      required: true
