name: Release
on:
  push:
    branches: [chore/release-engineering]
  workflow_dispatch:
    inputs:
      version:
        description: Stable or RC version without v, or edge
        required: true
        type: string
      publish:
        description: Request approval to publish these exact tested images
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'push' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

env:
  IMAGE: ghcr.io/xmahdi1/nexus

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.meta.outputs.version }}
      kind: ${{ steps.meta.outputs.kind }}
      date: ${{ steps.meta.outputs.date }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: meta
        name: Set and check release metadata
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          REQUESTED_PUBLISH: ${{ inputs.publish }}
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          version="$REQUESTED_VERSION"
          if [[ "$GITHUB_EVENT_NAME" == push || "$version" == edge ]]; then
            version="0.0.0-edge.$GITHUB_RUN_NUMBER"
          fi
          kind=$(python3 scripts/ci/release.py version "$version")
          if [[ "$kind" == edge && "$version" != "0.0.0-edge.$GITHUB_RUN_NUMBER" ]]; then
            echo 'Choose edge to build a development version.'
            exit 1
          fi
          if [[ "$REQUESTED_PUBLISH" == true ]]; then
            [[ "$GITHUB_REPOSITORY" == xmahdi1/nexus ]]
            [[ "$GITHUB_ACTOR" == "$REPO_OWNER" && "$GITHUB_REF" == refs/heads/main ]]
            if [[ "$kind" != edge ]]; then
              git fetch --no-tags origin "refs/tags/v$version:refs/tags/v$version"
              test "$(git rev-parse "refs/tags/v$version^{commit}")" = "$GITHUB_SHA"
            fi
          fi
          {
            echo "version=$version"
            echo "kind=$kind"
            echo "date=$(git show -s --format=%cI "$GITHUB_SHA")"
          } >> "$GITHUB_OUTPUT"

  native:
    name: Release image (${{ matrix.arch }})
    needs: plan
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: '1.27.4'
          cache: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14.4'
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          version: v0.39.1
          driver-opts: image=moby/buildkit@sha256:baf6138eb8c37644800c7c913fba051e840ebb9ba13eaf92d92ef9a1712d0b4c
      - name: Export tracked source and install fixture tools
        run: |
          set -euo pipefail
          python3 scripts/ci/export_source.py "$RUNNER_TEMP/nexus" --ref "$GITHUB_SHA"
          mkdir "$RUNNER_TEMP/evidence"
          python -m pip install --require-hashes --only-binary=:all: -r scripts/requirements-ci.txt
          GOBIN="$RUNNER_TEMP/bin" go install github.com/regclient/regclient/cmd/regctl@v0.11.7
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Build the native OCI archive
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ runner.temp }}/nexus
          platforms: linux/${{ matrix.arch }}
          outputs: type=oci,dest=${{ runner.temp }}/image.tar
          provenance: false
          sbom: false
          build-args: |
            VERSION=${{ needs.plan.outputs.version }}
            REVISION=${{ github.sha }}
            BUILD_DATE=${{ needs.plan.outputs.date }}
      - name: Test the archive by digest in a loopback registry
        run: |
          set -euo pipefail
          digest=$(python3 scripts/ci/release.py native             "$RUNNER_TEMP/image.tar" "$ARCH" "$VERSION" "$GITHUB_SHA"             "$RUNNER_TEMP/evidence/platform.json")
          registry_id=$(docker run -d --rm -p 127.0.0.1::5000             registry@sha256:6c5666b861f3505b116bb9aa9b25175e71210414bd010d92035ff64018f9457e)
          trap 'docker stop "$registry_id" >/dev/null' EXIT
          registry=$(docker port "$registry_id" 5000/tcp)
          curl --fail --retry 10 --retry-delay 1 --retry-connrefused "http://$registry/v2/"
          regctl registry set "$registry" --tls disabled
          regctl image import "$registry/nexus:test" "$RUNNER_TEMP/image.tar"
          test "$(regctl image digest "$registry/nexus:test")" = "$digest"
          docker pull "$registry/nexus@$digest"
          docker tag "$registry/nexus@$digest" nexus:release-test
          docker run --rm --network none nexus:release-test version |
            jq -e --arg version "$VERSION" --arg commit "$GITHUB_SHA" --arg arch "$ARCH"               '.version == $version and .commit == $commit and .arch == $arch and .os == "linux"'
          python3 scripts/ci/health_image.py --image nexus:release-test
          python3 scripts/deploy_lab.py --image nexus:release-test
          python3 scripts/ci/schema8_fixture.py
          old=$(docker image inspect nexus:ci-schema8 --format '{{.Id}}')
          python3 scripts/secrets_image_lab.py --old-image "$old" --new-image nexus:release-test
      - name: Scan the tested native image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.2
          image-ref: nexus:release-test
          format: json
          output: ${{ runner.temp }}/evidence/vulnerabilities.json
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          exit-code: '0'
          ignore-unfixed: 'false'
          scan-type: image
          scanners: vuln
      - name: Reject high and critical findings
        run: |
          jq -e '[.Results[]?.Vulnerabilities[]? | select(.Severity == "HIGH" or .Severity == "CRITICAL")] | length == 0' \
            "$RUNNER_TEMP/evidence/vulnerabilities.json"
      - name: Create the architecture SBOM
        uses: anchore/sbom-action@dfcb83b97731532d72be422cbc51ee64adb6fd56 # v0.24.4
        with:
          syft-version: v1.57.2
          image: nexus:release-test
          format: spdx-json
          output-file: ${{ runner.temp }}/evidence/nexus-${{ matrix.arch }}.spdx.json
          upload-artifact: 'false'
          dependency-snapshot: 'false'
          upload-release-assets: 'false'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: evidence-${{ matrix.arch }}
          path: ${{ runner.temp }}/evidence/
          if-no-files-found: error
          retention-days: 3
      - name: Encrypt the pre-approval image
        if: ${{ inputs.publish }}
        env:
          AGE_RECIPIENT: ${{ vars.NEXUS_RELEASE_RECIPIENT }}
        run: |
          set -euo pipefail
          [[ "$AGE_RECIPIENT" =~ ^age1[a-z0-9]+$ ]]
          GOBIN="$RUNNER_TEMP/bin" go install filippo.io/age/cmd/age@v1.3.2
          age -r "$AGE_RECIPIENT" -o "$RUNNER_TEMP/image.tar.age" "$RUNNER_TEMP/image.tar"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ inputs.publish }}
        with:
          name: sealed-${{ matrix.arch }}
          path: ${{ runner.temp }}/image.tar.age
          compression-level: 0
          if-no-files-found: error
          retention-days: 3

  index:
    name: Record tested digest
    needs: [plan, native]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      digest: ${{ steps.prepare.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: evidence-*
          path: ${{ runner.temp }}/evidence
      - id: prepare
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          digest=$(python3 scripts/ci/release.py assemble             "$RUNNER_TEMP/evidence" "$VERSION" "$GITHUB_SHA" "$RUNNER_TEMP/image-index.json")
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          printf 'Version %s\n\nSource commit: %s\n\nTested OCI index: %s\n' \
            "$VERSION" "$GITHUB_SHA" "$digest" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-index
          path: ${{ runner.temp }}/image-index.json
          if-no-files-found: error
          retention-days: 3

  publish:
    name: Publish approved digest
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish && github.repository == 'xmahdi1/nexus' && github.ref == 'refs/heads/main' && github.actor == github.repository_owner }}
    needs: [plan, index]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: release
    concurrency:
      group: ghcr-release
      cancel-in-progress: false
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      KIND: ${{ needs.plan.outputs.kind }}
      DIGEST: ${{ needs.index.outputs.digest }}
    steps:
      - name: Require an explicitly configured release environment
        env:
          RELEASE_ENABLED: ${{ vars.NEXUS_RELEASE_ENABLED }}
        run: test "$RELEASE_ENABLED" = enabled
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: '1.27.4'
          cache: false
      - name: Install pinned registry and encryption tools
        run: |
          set -euo pipefail
          GOBIN="$RUNNER_TEMP/bin" go install github.com/regclient/regclient/cmd/regctl@v0.11.7
          GOBIN="$RUNNER_TEMP/bin" go install filippo.io/age/cmd/age@v1.3.2
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: evidence-*
          path: ${{ runner.temp }}/evidence
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image-index
          path: ${{ runner.temp }}/index
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: sealed-*
          path: ${{ runner.temp }}/sealed
      - name: Decrypt approved archives and verify the index checksum
        env:
          AGE_IDENTITY: ${{ secrets.NEXUS_RELEASE_AGE_IDENTITY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$AGE_IDENTITY"
          actual=$(sha256sum "$RUNNER_TEMP/index/image-index.json" | cut -d ' ' -f 1)
          test "sha256:$actual" = "$DIGEST"
          for arch in amd64 arm64; do
            mkdir -p "$RUNNER_TEMP/archives/$arch"
            printf '%s\n' "$AGE_IDENTITY" | age -d -i -               -o "$RUNNER_TEMP/archives/$arch/image.tar"               "$RUNNER_TEMP/sealed/sealed-$arch/image.tar.age"
          done
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload by digest and confirm registry bytes
        run: |
          set -euo pipefail
          python3 scripts/ci/release.py stage "$IMAGE" "$VERSION" "$GITHUB_SHA"             "$RUNNER_TEMP/archives" "$RUNNER_TEMP/evidence" "$RUNNER_TEMP/index/image-index.json"             "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
      - uses: sigstore/cosign-installer@881c63bd87e38389154debd8331404ce7ca8a3ab # v4.1.4
        with:
          cosign-release: v3.1.6
      - name: Sign and verify the tested OCI index
        run: |
          set -euo pipefail
          cosign sign --yes "$IMAGE@$DIGEST"
          cosign verify --certificate-identity             "https://github.com/$GITHUB_REPOSITORY/.github/workflows/release.yml@refs/heads/main"             --certificate-oidc-issuer https://token.actions.githubusercontent.com             "$IMAGE@$DIGEST" > "$RUNNER_TEMP/signature.json"
      - id: provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ env.DIGEST }}
          push-to-registry: true
      - name: Verify published provenance
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROVENANCE_FILE: ${{ steps.provenance.outputs.bundle-path }}
        run: |
          gh attestation verify "oci://$IMAGE@$DIGEST" --repo "$GITHUB_REPOSITORY" \
            --bundle "$PROVENANCE_FILE" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
            --source-ref refs/heads/main --source-digest "$GITHUB_SHA" --deny-self-hosted-runners
      - name: Require public read access before announcing a release
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/anonymous-docker"
          if ! DOCKER_CONFIG="$RUNNER_TEMP/anonymous-docker"             regctl manifest get "$IMAGE@$DIGEST" --format raw-body >/dev/null; then
            echo 'The staged GHCR package is private. Make it public in package settings, then rerun this publication job.'
            exit 1
          fi
      - name: Publish the exact image tag
        run: |
          python3 scripts/ci/release.py promote "$IMAGE" "$VERSION" "$GITHUB_SHA"             "$RUNNER_TEMP/index/image-index.json"
      - name: Create the GitHub release and attach evidence
        if: ${{ needs.plan.outputs.kind != 'edge' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROVENANCE_FILE: ${{ steps.provenance.outputs.bundle-path }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          files="$RUNNER_TEMP/release-assets"
          mkdir "$files"
          cp scripts/deploy.py "$files/deploy.py"
          cp "$RUNNER_TEMP/index/image-index.json" "$files/"
          cp "$RUNNER_TEMP/signature.json" "$files/"
          cp "$PROVENANCE_FILE" "$files/provenance.jsonl"
          for arch in amd64 arm64; do
            cp "$RUNNER_TEMP/evidence/evidence-$arch/nexus-$arch.spdx.json" "$files/"
          done
          (cd "$files" && sha256sum ./* > SHA256SUMS)
          printf 'Image: %s@%s\n\nNative Linux AMD64 and ARM64.\n\n' \
            "$IMAGE" "$DIGEST" > "$RUNNER_TEMP/notes.md"
          flags=()
          if [[ "$KIND" == rc ]]; then flags=(--prerelease --latest=false); fi
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json body --jq .body > "$RUNNER_TEMP/current-notes"; then
            grep -Fq "$IMAGE@$DIGEST" "$RUNNER_TEMP/current-notes"
          else
            gh release create "$tag" "$files"/* --repo "$GITHUB_REPOSITORY" --verify-tag               --title "Nexus $VERSION" --generate-notes --notes-file "$RUNNER_TEMP/notes.md" "${flags[@]}"
          fi
      - name: Advance compatible channels
        run: |
          python3 scripts/ci/release.py promote "$IMAGE" "$VERSION" "$GITHUB_SHA"             "$RUNNER_TEMP/index/image-index.json" --aliases
