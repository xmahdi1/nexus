name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'feature/**', 'fix/**', 'chore/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    name: Backend
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: '1.27.4'
          cache-dependency-path: nexus/go.sum
      - name: Format, compile, race tests, vet and static analysis
        run: |
          python3 scripts/ci/check_go_format.py
          mkdir -p docs/validation/ci
          cd nexus
          go build ./cmd/nexus
          go test -race -coverpkg=./... -covermode=atomic -coverprofile=../docs/validation/ci/coverage.out ./...
          go vet ./...
          go mod verify
          go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-coverage
          path: docs/validation/ci/coverage.out
          retention-days: 7
          if-no-files-found: error
  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.20.0'
          cache: npm
          cache-dependency-path: nexus-vue/package-lock.json
      - name: Locked install and frontend checks
        run: |
          npm --prefix nexus-vue ci
          npm --prefix nexus-vue run lint
          npm --prefix nexus-vue run format:check
          node nexus-vue/node_modules/prettier/bin/prettier.cjs --config nexus-vue/.prettierrc.json --check 'scripts/**/*.mjs' 'scripts/**/*.json'
          npm --prefix nexus-vue run typecheck
          npm --prefix nexus-vue test
          npm --prefix nexus-vue run build
  contracts:
    name: Docs and script contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: '1.27.4'
          cache: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14.4'
      - name: Documentation, YAML, shell, Python and installer checks
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r scripts/requirements-ci.txt
          python scripts/ci/check_markdown_links.py
          python scripts/ci/check_scripts.py
          python -m ruff format --check scripts
          go run mvdan.cc/sh/v3/cmd/shfmt@v3.12.0 -d -i 2 -ci -sr scripts/*_lab/entrypoint.sh
          python scripts/ci/test_export_source.py
          python scripts/ci/test_release.py
          python scripts/ci/validate_compose.py
          python scripts/deploy_test.py
          python scripts/ansible_collections_test.py
          python scripts/ansible_callback_test.py
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          shellcheck scripts/*lab/entrypoint.sh
  security:
    name: Dependency and source security
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: '1.27.4'
          cache-dependency-path: nexus/go.sum
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.20.0'
          cache: npm
          cache-dependency-path: nexus-vue/package-lock.json
      - name: Vulnerability, license and full-history secret checks
        run: |
          npm --prefix nexus-vue ci
          npm --prefix nexus-vue audit
          python3 scripts/ci/check_licenses.py
          cd nexus
          go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 ./...
          cd ..
          go run github.com/zricethezav/gitleaks/v8@v8.30.0 git --log-opts=--all --redact --no-banner
  required:
    name: Required checks
    if: ${{ always() }}
    needs: [backend, frontend, contracts, security]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every fast check to succeed
        env:
          RESULTS: ${{ join(needs.*.result, ',') }}
        run: |
          test "$RESULTS" = 'success,success,success,success'
